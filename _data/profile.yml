short_bio: >-
  <p>
   Hello 👋 I am a Ph.D. student at Korea University, advised by Prof. Sangpil Kim. My research explores how embodied agents can reason, learn, and act in the physical world. In particular, I am interested in developing self-supervising and self-improving embodied agents through reasoning, with a focus on reasoning verification, latent reasoning, and continual learning and adaptation.
  </p>
  <p>
  I'm always happy to chat about embodied AI, embodied reasoning, and related research. Feel free to reach out by email or schedule a 
